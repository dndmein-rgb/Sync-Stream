name: syncstream

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncstream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncstream}
      POSTGRES_DB: syncstream
    ports:
      - "5432:5432"
    volumes:
      - syncstream_postgres_data:/var/lib/postgresql/data
    networks:
      - syncstream-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncstream -d syncstream"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: syncstream-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - syncstream_redis_data:/data
    networks:
      - syncstream-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: syncstream-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - syncstream_zookeeper_data:/var/lib/zookeeper/data
    networks:
      - syncstream-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: syncstream-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9093"   # host talks to PLAINTEXT_HOST on 9093 inside the container
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - syncstream_kafka_data:/var/lib/kafka/data
    networks:
      - syncstream-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: syncstream-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: syncstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - syncstream-net

  # Optional — remove if you don't want a UI for Postgres
  pgadmin:
    image: dpage/pgadmin4
    container_name: syncstream-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@syncstream.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - syncstream-net

volumes:
  syncstream_postgres_data:
  syncstream_redis_data:
  syncstream_zookeeper_data:
  syncstream_kafka_data:

networks:
  syncstream-net:
    driver: bridge